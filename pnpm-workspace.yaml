packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true
  msgpackr-extract: false
  onnxruntime-node: true
  protobufjs: false
  # Only runs an optional OpenCollective notice. OCR model bytes are imported
  # through the model-resource control plane rather than a dependency script.
  tesseract.js: false

catalog:
  "@eslint/js": 10.0.1
  "@nestjs/common": 11.2.7
  "@nestjs/core": 11.2.7
  "@nestjs/platform-fastify": 11.2.7
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/exporter-metrics-otlp-http": 0.221.0
  "@opentelemetry/exporter-trace-otlp-http": 0.221.0
  "@opentelemetry/sdk-metrics": 2.10.0
  "@opentelemetry/sdk-node": 0.221.0
  "@sinclair/typebox": 0.34.52
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-query": 5.101.4
  "@tanstack/react-router": 1.170.18
  "@types/node": 22.20.1
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@vitejs/plugin-react": 6.0.4
  ajv: 8.20.0
  ajv-formats: 3.0.1
  bullmq: 5.81.2
  dependency-cruiser: 18.1.0
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  eslint: 10.8.0
  fastify: 5.12.7
  globals: 17.8.0
  https-proxy-agent: 7.0.6
  ioredis: 5.11.1
  jose: 6.2.4
  mysql2: 3.23.1
  nodemailer: 10.0.10
  onnxruntime-node: 1.29.0
  onnxruntime-web: 1.27.0
  openapi-typescript: 7.13.0
  pino: 10.3.1
  react: 19.2.8
  react-dom: 19.2.8
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  sharp: 0.35.5
  tailwindcss: 4.3.3
  tsx: 4.23.1
  turbo: 2.10.7
  typescript: 5.9.3
  typescript-eslint: 8.65.0
  ulid: 3.0.2
  vite: 8.1.5
  vitest: 4.1.12

disallowWorkspaceCycles: true
enableGlobalVirtualStore: false
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

# Security overrides for transitive packages whose parents still resolve an
# affected release. Remove each override after the parent range resolves safely.
overrides:
  "@nestjs/platform-fastify>fastify": 5.12.7
  "@tiptap/extension-bubble-menu": 3.30.5
  "@tiptap/extension-floating-menu": 3.30.5
  "seroval": 1.6.9
  "seroval-plugins": 1.6.9
  "adm-zip": 0.6.1
  "undici@^6": 6.29.1
  "@grpc/grpc-js": 1.14.6
  "prosemirror-view": 1.42.6
  "source-map-js": 1.2.2
  "@ai-sdk/provider-utils@^4": 4.0.60
  "gray-matter>js-yaml": 3.15.2
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  "@fastify/ajv-compiler>fast-uri": 3.1.8
  "@nestjs/platform-fastify>find-my-way": 9.7.0
  "ajv>fast-uri": 3.1.8
  "fast-json-stringify>fast-uri": 4.2.2
  "postcss>nanoid": 3.3.18

minimumReleaseAgeExclude:
  - globals@17.8.0
  - remend@1.3.1
  - streamdown@2.6.0
  - "@ai-sdk/provider-utils@4.0.60"
  - "@ai-sdk/provider@3.0.19"
  - "@vitest/expect@4.1.12"
  - "@vitest/mocker@4.1.12"
  - "@vitest/pretty-format@4.1.12"
  - "@vitest/runner@4.1.12"
  - "@vitest/snapshot@4.1.12"
  - "@vitest/spy@4.1.12"
  - "@vitest/utils@4.1.12"
  - undici@6.29.1
  - vitest@4.1.12

# Single-character CJK queries must reach both the picker and its search index.
patchedDependencies:
  emoji-picker-element@1.29.1: patches/emoji-picker-element@1.29.1.patch
  mysql2@3.23.1: patches/mysql2@3.23.1.patch
