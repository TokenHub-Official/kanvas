apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanvas
spec:
  ingressClassName: REPLACE_WITH_PLATFORM_CLASS
  tls:
    - hosts: [kanvas.example.invalid]
      secretName: kanvas-tls
  rules:
    - host: kanvas.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanvas
                port:
                  number: 8080
