[[allowlists]]
description = "Environment variable access, not a credential value"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(?:^|/)packages/storage/src/storage\-runtime\-config\.ts$''']
regexes = ['''^\s*const\ keyPrefix\ =\ environment\.KANVAS_S3_KEY_PREFIX;\s*$''']
